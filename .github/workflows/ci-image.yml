name: Auto Build FlagOS Inference Image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '镜像标签（如vllm-cuda-amd64-test-20251216，留空用默认）'
        required: false
        default: 'vllm-cuda-amd64-test-$(date +%Y%m%d)' # 默认标签：日期戳
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/auto-build-flagos.yml'
  release:
    types: [ published ]

jobs:
  build-push-image:
    runs-on: [ self-hosted, Linux, X64, ye_test ]
    defaults:
      run:
        shell: bash
    outputs:
      image_full_name: ${{ steps.set-tag.outputs.image_full_name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          elif [ -n "${{ github.ref_name }}" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            IMAGE_TAG="vllm-cuda-amd64-test-${{ github.ref_name }}"
          else
            IMAGE_TAG="vllm-cuda-amd64-test-$(date +%Y%m%d)"
          fi

          IMAGE_FULL_NAME="localhost:5000/flagos:${IMAGE_TAG}"

          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_full_name=${IMAGE_FULL_NAME}" >> $GITHUB_OUTPUT

          echo "构建的完整镜像名：${IMAGE_FULL_NAME}"

      - name: Check Docker & Registry
        run: |
          # 检查Docker是否安装
          docker --version || (echo "Docker未安装，退出构建" && exit 1)
          # 检查本地仓库是否可达
          curl -s http://localhost:5000/v2/_catalog || (echo "本地镜像仓库localhost:5000不可达，退出构建" && exit 1)
          echo "Docker环境和本地仓库校验通过"

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ steps.set-tag.outputs.image_full_name }} \
            .

      - name: Push image to local registry
        run: |
          docker push ${{ steps.set-tag.outputs.image_full_name }}
          echo "镜像推送成功：${{ steps.set-tag.outputs.image_full_name }}"

      - name: Clean local image (optional)
        if: always()
        run: |
          docker rmi ${{ steps.set-tag.outputs.image_full_name }} || echo "镜像清理失败（可能已被删除），忽略"

  experimental-test:
    needs: build-push-image
    runs-on: [ self-hosted, Linux, X64, ye_test ]
    defaults:
      run:
        shell: bash
    container:
      image: ${{ needs.build-push-image.outputs.image_full_name }}
      ports:
        - 80:80
      options: --pull always
    steps:
      - name: Test container running
        run: |
          # 校验容器是否正常启动
          echo "容器镜像：${{ needs.build-push-image.outputs.image_full_name }}"
          uname -a # 查看系统信息
          nvcc -V || echo "nvcc未安装，忽略" # 若有CUDA，校验CUDA环境
          echo "测试步骤执行完成"

