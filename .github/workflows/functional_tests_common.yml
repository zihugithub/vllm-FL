name: FlagScale test

on:
  push:
    branches: ["test_ye"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  functional_test:
    runs-on: [self-hosted, ye_test]
    defaults:
      run:
        shell: bash
    container:
      image: localhost:5000/flagscale:cuda12.8.1-cudnn9.7.1-python3.12-torch2.7.1-time2510131515
      ports:
        - 80
      options: --gpus all --shm-size=500g --hostname flagscale_cicd --user root --ulimit nofile=65535:65535

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          ssh-strict: true
          ssh-user: git
          persist-credentials: false
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      
      - name:  Set up flash-attn for inference(robobrain2)
        timeout-minutes: 15
        working-directory: /__w/vllm-FL/vllm-FL
        env:
          SCCACHE_CPP2: 1
          CUDA_CCACHE: 1
          SCCACHE_CACHE_SIZE: 20G
          SCCACHE_VERBOSE: 0
          CMAKE_C_COMPILER_LAUNCHER: $(command -v sccache)
          CMAKE_CXX_COMPILER_LAUNCHER: $(command -v sccache)
          CMAKE_CUDA_COMPILER_LAUNCHER: $(command -v sccache)
        run: |
          CONDA_ENV='flagscale-inference'
          CONDA_PATH='/root/miniconda3'

          # Source conda utilities for reusable functions
          source ./tools/install/utils/conda_utils.sh

          # Conditionally activate conda environment if specified
          if [ -n "$CONDA_ENV" ]; then
            if activate_conda "$CONDA_ENV" "$CONDA_PATH"; then
              : # Success message already displayed by activate_conda
            else
              echo "⚠️  Conda environment requested but conda not found"
              echo "Continuing without conda activation..."
            fi
          else
            echo "ℹ️  Running tests with system Python"
          fi

          pip uninstall -y flash_attn
          pip install flash-attn==2.6.3 --no-build-isolation
          python -c "import flash_attn; import flash_attn.layers; print('FlashAttention loaded successfully, version:', flash_attn.__version__)"
