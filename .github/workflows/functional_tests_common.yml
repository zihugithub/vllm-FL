name: FlagScale test

on:
  push:
    branches: ["test_ye"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  functional_test:
    runs-on: [self-hosted, ye_test]
    defaults:
      run:
        shell: bash
    container:
      image: localhost:5000/flagscale:cuda12.8.1-cudnn9.7.1-python3.12-torch2.7.1-time2510131515
      ports:
        - 80
      options: --gpus all --shm-size=500g --hostname flagscale_cicd --user root --ulimit nofile=65535:65535

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          ssh-strict: true
          ssh-user: git
          persist-credentials: false
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Load Conda profile configuration (enable conda command)
        run: |
          if [[ ! -f ".github/workflows/scripts/load_conda_profile.sh" ]]; then
            echo "Error: Conda load script not found!" >&2
            exit 1
          fi

          source .github/workflows/scripts/load_conda_profile.sh
        timeout-minutes: 5

      - name: Install FlagScale training dependencies
        timeout-minutes: 5
        run: |
          echo "📌 GitHub Actions default workspace: ${GITHUB_WORKSPACE}"

          conda activate flagscale-train
          source .github/workflows/scripts/retry_functions.sh

          COMMANDS=(
            "rm -rf ${GITHUB_WORKSPACE}/Megatron-LM-FL"
            "git clone https://github.com/flagos-ai/Megatron-LM-FL.git"
            "pip install httpx multi-storage-client boto3 google-cloud-storage fastapi uvicorn griffe"
            "cd ${GITHUB_WORKSPACE}/Megatron-LM-FL && pip install --no-build-isolation . -vvv"
          )

          retry_commands 3 "${COMMANDS[@]}"
