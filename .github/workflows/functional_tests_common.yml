name: FlagScale Tests Nvidia

on:
  push:
    branches: test_ye

env:
  DEFAULT_TYPE: ${{ inputs.type || 'train' }}
  DEFAULT_TASK: ${{ inputs.task || 'deepseek' }}
  DEFAULT_IMAGE: ${{ inputs.image || 'localhost:5000/flagscale:cuda12.8.1-cudnn9.7.1-python3.12-torch2.7.1-time2510131515' }}

jobs:
  checkout_and_config:
    defaults:
      run:
        shell: bash
    runs-on: [ self-hosted, ye_test]
    container:
      image: localhost:5000/flagscale:cuda12.8.1-cudnn9.7.1-python3.12-torch2.7.1-time2510131515
      options: --gpus all --shm-size=500g --hostname flagscale_cicd --user root --ulimit nofile=65535:65535

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Load platform configuration
        id: config
        run: |
          set -euo pipefail

          CONFIG_FILE=".github/configs/unit.yml"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Error: Platform configuration file not found: $CONFIG_FILE"
            echo "Available configs:"
            ls -la .github/configs/
            exit 1
          fi

          # Install mikefarah/yq (v4) for YAML parsing
          wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          /usr/local/bin/yq --version

          wget -qO /usr/local/bin/jq https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-amd64
          chmod +x /usr/local/bin/jq
          /usr/local/bin/jq --version

          source .github/scripts/load_config.sh
          load_config test1

          echo ">>>: ${depth}"
          echo ">>>: ${ignore}"
          echo ">>>: ${deselect}"
