name: FlagScale test

on:
  push:
    branches: ["test_ye"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  functional_test:
    runs-on: [self-hosted, ye_test]
    defaults:
      run:
        shell: bash
    container:
      image: localhost:5000/flagscale:cuda12.8.1-cudnn9.7.1-python3.12-torch2.7.1-time2510131515
      ports:
        - 80
      volumes:
        - /home/flagscale_cicd/sccache:/root/.cache/sccache
      options: --gpus all --shm-size=500g --hostname flagscale_cicd --user root --ulimit nofile=65535:65535

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          ssh-strict: true
          ssh-user: git
          persist-credentials: false
          clean: true
          sparse-checkout-cone-mode: true
          fetch-tags: false
          show-progress: true
          lfs: false
          submodules: false
          set-safe-directory: true

      - name: Check sccache installation and get path
        id: get_sccache_path
        timeout-minutes: 15
        working-directory: /__w/vllm-FL/vllm-FL
        run: |
          echo "=== Step 1: Check if sccache is installed ==="
          if ! command -v sccache &> /dev/null; then
            echo "❌ Error: sccache is not found in system PATH! Please install sccache first."
            exit 1
          else
            source ./tools/install/utils/check_sccache.sh
          fi

          SCCACHE_PATH=$(command -v sccache)
          echo "sccache_path=${SCCACHE_PATH}" >> $GITHUB_OUTPUT

          echo "Found sccache at: ${SCCACHE_PATH}"

      - name: Install vllm
        working-directory: /__w/vllm-FL/vllm-FL
        env:
          SCCACHE_CPP2: 1
          CUDA_CCACHE: 1
          SCCACHE_VERBOSE: 0
          SCCACHE_CACHE_SIZE: 20G
          SCCACHE_DIR: /root/.cache/sccache
          CMAKE_C_COMPILER_LAUNCHER: ${{ steps.get_sccache_path.outputs.sccache_path }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ steps.get_sccache_path.outputs.sccache_path }}
          CMAKE_CUDA_COMPILER_LAUNCHER: ${{ steps.get_sccache_path.outputs.sccache_path }}
        run: |
          CONDA_ENV='flagscale-inference'
          CONDA_PATH='/root/miniconda3'

          echo "CMAKE_C_COMPILER_LAUNCHER: ${CMAKE_C_COMPILER_LAUNCHER}"
          echo "CMAKE_CXX_COMPILER_LAUNCHER: ${CMAKE_CXX_COMPILER_LAUNCHER}"
          echo "CMAKE_CUDA_COMPILER_LAUNCHER: ${CMAKE_CUDA_COMPILER_LAUNCHER}"

          # Source conda utilities for reusable functions
          source ./tools/install/utils/conda_utils.sh

          # Conditionally activate conda environment if specified
          if [ -n "$CONDA_ENV" ]; then
            if activate_conda "$CONDA_ENV" "$CONDA_PATH"; then
              : # Success message already displayed by activate_conda
            else
              echo "⚠️  Conda environment requested but conda not found"
              echo "Continuing without conda activation..."
            fi
          else
            echo "ℹ️  Running tests with system Python"
          fi

          cd /workflow && git clone https://github.com/zihugithub/FlagScale.git
          cd /workflow/FlagScale && git clone https://github.com/flagos-ai/vllm-FL.git
          pip install . -vvv
          