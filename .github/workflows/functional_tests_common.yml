name: Unit Tests CUDA

on:
  push:
    branches: test_ye
  pull_request:
    branches: main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.actor }}
  cancel-in-progress: true

jobs:
  run_unit:
    defaults:
      run:
        shell: bash
    runs-on: [ self-hosted, ye_test]
    container:
      image: localhost:5000/flagscale:cuda12.8.1-cudnn9.7.1-python3.12-torch2.7.1-time2510131515
      options: --gpus all --shm-size=500g --hostname flagscale_cicd --user root --ulimit nofile=65535:65535
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install auxiliary tools
        timeout-minutes: 5
        run: |
          set -euo pipefail

          YQ_VERSION="v4.45.1"
          JQ_VERSION="1.7.1"
          BIN_DIR="/usr/local/bin"

          [ -w "$BIN_DIR" ] || { echo "Error: $BIN_DIR is not writable!"; exit 1; }

          # Install mikefarah/yq (v4) for YAML parsing
          echo "Installing yq $YQ_VERSION..."
          curl -sSL --retry 3 "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64" -o "$BIN_DIR/yq"
          chmod +x "$BIN_DIR/yq"
          yq --version

          echo "Installing jq $JQ_VERSION..."
          curl -sSL --retry 3 "https://github.com/jqlang/jq/releases/download/jq-$JQ_VERSION/jq-linux-amd64" -o "$BIN_DIR/jq"
          chmod +x "$BIN_DIR/jq"
          jq --version

      - name: Load unit case
        id: config
        run: |
          set -euo pipefail

          UNIT_NAME="compile"

          CONFIG_FILE=".github/configs/unit.yml"

          echo "PWD: $PWD"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Error: Platform configuration file not found: $CONFIG_FILE"
            echo "Available configs:"
            ls -la .github/configs/
            exit 1
          fi

          # Extract CI/CD configuration from .github/configs using yq
          echo "Extracting configuration from $CONFIG_FILE"
          DEPTH_JSON=$(/usr/local/bin/yq -r  -o=json -I=0 ".unit-conf.$UNIT_NAME.depth" "$CONFIG_FILE")
          IGNORE_JSON=$(/usr/local/bin/yq -r  -o=json -I=0 ".unit-conf.$UNIT_NAME.ignore" "$CONFIG_FILE")
          DESELECT_JSON=$(/usr/local/bin/yq -r  -o=json -I=0 ".unit-conf.$UNIT_NAME.deselect" "$CONFIG_FILE")

          echo "Depth: $DEPTH_JSON"
          echo "Ignore: $IGNORE_JSON"
          echo "Deselect: $DESELECT_JSON"

          # Validate required fields
          if [ -z "$DEPTH_JSON" ] || [ -z "$IGNORE_JSON" ] || [ -z "$DESELECT_JSON" ]; then
              echo "❌ Error: One or more required fields are missing in unit config '$UNIT_NAME'."
              return 1
          fi

          if [ "$DEPTH_JSON" = "all" ]; then
              DEPTH=$(find "tests" -type d | awk -F/ '{print NF-1}' | sort -nr | head -n 1)
          else
              DEPTH="$DEPTH_JSON"
          fi
          # TEST_FILES=$(find tests/$UNIT_NAME -mindepth 1 -maxdepth $DEPTH  -name "test_*.py" -type f)

          if [ $(echo $IGNORE_JSON | jq 'length') -gt 0 ]; then
              IGNORE=$(echo $IGNORE_JSON | jq -r '.[] | "--ignore=\(.)"' | tr '\n' ' ')
          else
              IGNORE="pass"
          fi

          if [ $(echo $DESELECT_JSON | jq 'length') -gt 0 ]; then
              DESELECT=$(echo $DESELECT_JSON | jq -r '.[] | "--ignore=\(.)"' | tr '\n' ' ')
          else
              DESELECT="pass"
          fi

          echo "📤 Setting output parameters..."
          echo "depth=$DEPTH" >> "$GITHUB_OUTPUT"
          echo "ignore=$IGNORE" >> "$GITHUB_OUTPUT"
          echo "deselect=$DESELECT" >> "$GITHUB_OUTPUT"
          # echo "test_files=$TEST_FILES" >> "$GITHUB_OUTPUT"
          
      - name: run test
        run: |
          echo ">>>: ${steps.config.outputs.depth}"
          echo ">>>: ${steps.config.outputs.ignore}"
          echo ">>>: ${steps.config.outputs.deselect}"
          # echo ">>>: ${steps.config.outputs.test_file}"
